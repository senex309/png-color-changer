  <body>
    <div class="card">
      <h2>PNG Icon Color Changer</h2>
      <p style="font-size: 0.9rem; color: #9ca3af">
        Upload a PNG (ideally a white or solid icon with transparency), pick a
        color, then download.
      </p>
      <label for="fileInput">PNG file</label>
      <input id="fileInput" type="file" accept="image/png" />
      <div class="row">
        <div>
          <label for="colorInput">Color</label>
          <input id="colorInput" type="color" value="#00ffcc" />
        </div>
        <button id="applyBtn" disabled>Apply color</button>
      </div>
      <canvas id="canvas" style="display: none"></canvas>
      <img id="preview" class="hidden" alt="Preview will appear here" />
      <button id="downloadBtn" disabled>Download PNG</button>
    </div>
    <script>
      const fileInput = document.getElementById("fileInput");
      const colorInput = document.getElementById("colorInput");
      const applyBtn = document.getElementById("applyBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const preview = document.getElementById("preview");
      preview.src = canvas.toDataURL("image/png");
      preview.classList.remove("hidden");
      let img = new Image();
      let imgLoaded = false;
      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          img = new Image();
          img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            preview.src = canvas.toDataURL("image/png");
            imgLoaded = true;
            applyBtn.disabled = false;
            downloadBtn.disabled = false;
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
      function hexToRGBA(hex) {
        hex = hex.replace("#", "");
        if (hex.length === 3) {
          hex = hex
            .split("")
            .map((c) => c + c)
            .join("");
        }
        const num = parseInt(hex, 16);
        return {
          r: (num >> 16) & 255,
          g: (num >> 8) & 255,
          b: num & 255,
          a: 255,
        };
      }
      applyBtn.addEventListener("click", () => {
        if (!imgLoaded) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        const { r: cr, g: cg, b: cb } = hexToRGBA(colorInput.value);
        for (let i = 0; i < data.length; i += 4) {
          const alpha = data[i + 3];
          if (alpha > 0) {
            data[i] = cr;
            data[i + 1] = cg;
            data[i + 2] = cb;
          }
        }
        ctx.putImageData(imageData, 0, 0);
        preview.src = canvas.toDataURL("image/png");
      });
      downloadBtn.addEventListener("click", () => {
        if (!imgLoaded) return;
        const link = document.createElement("a");
        link.download = "recolored-icon.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    </script>
